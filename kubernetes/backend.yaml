apiVersion: v1
kind: Namespace
metadata:
  name: dacn2-lab
  labels:
    app.kubernetes.io/part-of: dacn2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dacn2-lab
  labels:
    app.kubernetes.io/part-of: dacn2
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app: dacn2-backend
  template:
    metadata:
      labels:
        app: dacn2-backend
        app.kubernetes.io/part-of: dacn2
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-db-dns
          image: dacn2-backend:m105c
          imagePullPolicy: Never
          command:
            - node
            - -e
            - |
              const dns = require('node:dns').promises;
              const { setTimeout: delay } = require('node:timers/promises');
              const timeout = setTimeout(() => {
                console.error('DB DNS startup deadline exceeded');
                process.exit(1);
              }, 60000);
              (async () => {
                const deadline = Date.now() + 45000;
                while (Date.now() < deadline) {
                  try {
                    await dns.lookup('host.docker.internal');
                    clearTimeout(timeout);
                    console.log('DB DNS ready');
                    return;
                  } catch { await delay(1000); }
                }
                clearTimeout(timeout);
                console.error('DB DNS unavailable');
                process.exitCode = 1;
              })();
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
      containers:
        - name: backend
          image: dacn2-backend:m105c
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: '3000'
            - name: NODE_OPTIONS
              value: --max-old-space-size=96
            - name: DB_HOST
              value: host.docker.internal
            - name: DB_PORT
              value: '5432'
            - name: DB_NAME
              value: dacn2
            - name: DB_USER
              value: dacn2_app
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-db
                  key: DB_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: dacn2-lab
  labels:
    app.kubernetes.io/part-of: dacn2
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: dacn2-backend
  ports:
    - name: http
      port: 3000
      targetPort: http
      nodePort: 30080
